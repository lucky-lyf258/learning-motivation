<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>登录 · 学习激励</title>
<style>
:root{--accent:#2563eb;--bg:#fafafa;--card:#fff;--border:#e5e7eb;--text:#111827;--text2:#6b7280;--text3:#9ca3af;--radius:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(160deg,#f8fafc,#eef2ff);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{width:100%;max-width:380px}
.logo{text-align:center;margin-bottom:30px}
.logo .mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:28px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(37,99,235,.3)}
.logo h1{font-size:20px;margin-top:14px;font-weight:700;letter-spacing:.5px}
.logo p{font-size:13px;color:var(--text2);margin-top:4px}
.card{background:var(--card);border-radius:var(--radius);padding:26px;box-shadow:0 10px 40px rgba(17,24,39,.08);border:1px solid var(--border)}
.card h3{font-size:17px;margin-bottom:18px;font-weight:700}
.field{margin:14px 0}
.field label{display:block;font-size:12px;color:var(--text2);margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:11px;font-size:15px;background:#f9fafb;color:var(--text);transition:.15s}
.field input:focus{outline:none;border-color:var(--accent);background:#fff}
.btn{display:block;width:100%;padding:14px;border-radius:11px;background:var(--accent);color:#fff;font-weight:600;font-size:15px;margin-top:18px;cursor:pointer;border:none;transition:.15s}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.toggle{text-align:center;margin-top:16px;font-size:14px;color:var(--accent);cursor:pointer;font-weight:500}
.err{background:#fef2f2;color:#dc2626;font-size:13px;border-radius:8px;padding:9px 12px;margin-top:12px;display:none}
.hint{font-size:12px;color:var(--text3);text-align:center;margin-top:20px;line-height:1.7}
.admin{text-align:center;margin-top:16px;font-size:12px;color:var(--text3);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.adminform{display:none;margin-top:6px}
.divider{display:flex;align-items:center;gap:10px;margin:20px 0 4px;color:var(--text3);font-size:12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="mark">志</div>
    <h1>学习激励机制</h1>
    <p>记录目标 · 持续进步</p>
  </div>

  <div class="card">
    <div id="userForm">
      <h3 id="formTitle">登录</h3>
      <div class="field"><label>邮箱</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email"></div>
      <div class="field"><label>密码</label><input id="pass" type="password" placeholder="请输入密码" autocomplete="current-password"></div>
      <div class="field" id="nickWrap" style="display:none"><label>昵称</label><input id="nick" placeholder="怎么称呼你" autocomplete="nickname"></div>
      <div class="err" id="err"></div>
      <button class="btn" id="submit">登 录</button>
      <div class="toggle" id="toggle">没有账号？注册一个</div>
    </div>
  </div>
  <div class="hint">登录即用。管理员账号为 admin（与普通用户同入口）。</div>
</div>

<script src="lib/supabase.js"></script>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
(function(){
const C=window.APP, S=window.Shared, sb=S.sb;
let mode="login";   // login | register
const $=s=>document.querySelector(s);

function setMode(m){
  mode=m;
  $("#formTitle").textContent = m==="login"?"登录":"创建账号";
  $("#submit").textContent = m==="login"?"登 录":"注册";
  $("#toggle").textContent = m==="login"?"没有账号？注册一个":"已有账号？去登录";
  $("#nickWrap").style.display = m==="register"?"block":"none";
  $("#err").style.display="none";
}
$("#toggle").onclick=()=>setMode(mode==="login"?"register":"login");

async function submit(){
  const email=$("#email").value.trim(), pass=$("#pass").value;
  if(!email||!pass){showErr("请输入邮箱和密码");return;}
  $("#submit").disabled=true;
  try{
    if(mode==="register"){
      if(pass.length<6){showErr("密码至少6位");return;}
      const nick=$("#nick").value.trim()||email.split("@")[0];
      const r=await S.signUp(email,pass,nick);
      if(r.error){showErr(r.error);return;}
      finishUser();
    }else{
      // 单入口：管理员账号 admin 直接进管理端，其余走普通登录
      if(email.toLowerCase()==="admin"){
        if(pass==="admin123"){
          sessionStorage.setItem("lm_admin","1");
          finishAdmin();
        } else {
          showErr("管理员密码错误");
        }
        return;
      }
      const r=await S.signIn(email,pass);
      if(r.error){showErr(r.error);return;}
      finishUser();
    }
  }finally{ $("#submit").disabled=false; }
}

function showErr(m){ $("#err").textContent=m; $("#err").style.display="block"; }
function finishUser(){
  // 普通用户一律进入用户端
  location.href="app/index.html";
}
function finishAdmin(){
  location.href="admin/index.html";
}
$("#submit").onclick=submit;
$("#email").addEventListener("keydown",e=>{if(e.key==="Enter")$("#pass").focus()});
$("#pass").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});

// 已登录直接跳（普通用户登录态）
(async()=>{
  const u=await S.init();
  if(u) finishUser();
})();
})();
</script>
</body>
</html>
